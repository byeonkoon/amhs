# Tests step the simulator by hand; a background loop would act on shared test data.
amhs.simulation.auto-run=false

# Tests open the restart check by hand; one opened at start would hold every other test still.
amhs.restart-check.on-start=false

# Adapter settings for the test run, here rather than on the test classes: a class that declares its
# own properties gets its own application context, and every extra context is another connection
# pool on the one test cluster. The suite ran out of connections before it ran out of tests.
amhs.device.mappings=../docs/sample-mappings
amhs.device.tcp.connect-timeout-ms=400
amhs.device.tcp.ack-timeout-ms=400
amhs.device.tcp.retry-after-ms=0
amhs.device.mqtt.connect-timeout-s=2
amhs.device.mqtt.publish-timeout-ms=2000
amhs.device.mqtt.retry-after-ms=0
